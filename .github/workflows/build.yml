name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build Release x64
        run: msbuild NativeHDRShot.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Test encoders, clipboard, editor and selector
        shell: pwsh
        run: ./test.ps1

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: NativeHDRShot-windows-x64
          path: bin/NativeHDRShot.exe
          if-no-files-found: error
